name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_expensive_checks:
        description: "Run full simulator suite and full benchmark"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "0 8 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: git diff --check
      - run: npm run viewer:contracts:check
      - run: npm run viewer:model:test
      - run: npm run viewer:map:test
      - run: npm run viewer:validate
      - run: npm run sim:golden
      - run: npm run sim:test
      - run: npm run sim:gate:quick -- --fail-on-blockers
      - run: |
          MIND_GATE_TMP="$(mktemp -d)"
          npm run sim:mind:gate -- \
            --train-seed 7 \
            --validation-seed 8 \
            --ticks 20 \
            --validation-ticks 20 \
            --trajectory-dir "$MIND_GATE_TMP/trajectories" \
            --artifact-output "$MIND_GATE_TMP/artifact.json" \
            --output "$MIND_GATE_TMP/report.json" \
            --experiment-ledger-output "$MIND_GATE_TMP/ledger.jsonl" \
            --skip-artifact-diagnostics \
            --fail-on-blockers
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run sim:run -- --seed 7 --ticks 120 --output output/sim-runs/species-check.json
          python3 -m http.server 4173 >/tmp/viewer-serve.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          npm run viewer:smoke

  mind-recurrent-cpu:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      PYTHONPATH: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
          cache: pip
          cache-dependency-path: requirements-mind-ci.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-mind-ci.txt
      - name: Install CPU-only Torch
        run: >-
          python -m pip install --disable-pip-version-check
          --index-url https://download.pytorch.org/whl/cpu
          torch==2.11.0
      - name: Prove Torch is available
        run: >-
          python -c 'import numpy, torch;
          assert numpy.__version__ == "2.4.4";
          assert torch.__version__.split("+", 1)[0] == "2.11.0"'
      - name: Run recurrent Mind contracts with Torch enabled
        run: python -m unittest discover -s python/tests -p 'test_recurrent_*.py' -v

  expensive:
    if: github.event_name == 'schedule' || github.event.inputs.run_expensive_checks == 'true'
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run sim:golden
      - run: npm run sim:test:full
      - run: npm run sim:gate:release
      - run: npm run sim:mind:gate -- --reuse-trajectories --fail-on-blockers
      - run: npm run sim:bench
